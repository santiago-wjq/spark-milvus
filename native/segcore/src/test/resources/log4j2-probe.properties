# log4j2 configuration for SegcoreProbe: native lines on the console, in the
# layout an executor's default configuration uses, with the thread name.
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %p %c{1} [%t] %m%n
